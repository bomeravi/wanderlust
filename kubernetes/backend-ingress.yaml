apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderlust-backend-ingress
  namespace: wanderlust
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  tls:
    - hosts:
        - wanderlust-backend.digi.saroj.name.np
      secretName: wanderlust-backend-tls

  rules:
    - host: wanderlust-backend.digi.saroj.name.np
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080